# Updates proposed every Monday, grouped; each proposal goes through the full CI (types, tests, Lighthouse) before it is
# accepted. Major versions come separately: they may break something.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Europe/Paris }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Europe/Paris }
    groups:
      actions:
        patterns: ["*"]
