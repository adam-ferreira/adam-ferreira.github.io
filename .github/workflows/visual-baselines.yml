# Regenerates the Linux baselines of the visual comparison (tests/visual.spec.ts-snapshots/*-linux.png).
# Run it by hand (Actions tab, or: gh workflow run visual-baselines.yml) after an intended change of appearance, or if
# the Ubuntu image of GitHub runners changes font rendering. Screenshots come out as an artifact, to be committed.
name: Visual baselines (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Regenerate the screenshots
        run: npx playwright test visual --update-snapshots=all
        env:
          VISUAL_IN_CI: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: tests/visual.spec.ts-snapshots/*-linux.png
          retention-days: 7
