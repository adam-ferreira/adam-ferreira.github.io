# À chaque push sur main : vérification des types, tests Playwright sur le site construit (ordinateur, iPhone, captures
# de référence), Lighthouse avec seuils — et publication sur GitHub Pages seulement si tout passe. Une pull request
# (Dependabot compris) est testée sans être publiée. Ubuntu figé (24.04) : les captures de référence Linux en dépendent.
name: Tester et publier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tout l'historique : la date « Updated … » est celle du dernier commit du contenu
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vérification des types (Astro, TypeScript)
        run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Lighthouse (seuils : 100 accessibilité, bonnes pratiques, référencement ; ≥ 90 performance)
        run: npx lhci autorun
      - name: Rapports (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports
          path: |
            playwright-report/
            lighthouse-report/
          retention-days: 14

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tout l'historique : la date « Updated … » est celle du dernier commit du contenu
      - name: Construire et préparer la publication
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
