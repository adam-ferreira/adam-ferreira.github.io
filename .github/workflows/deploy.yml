# On every push to main: type check, Playwright tests on the built site (desktop, iPhone, visual baselines), Lighthouse
# with thresholds — and publishing to GitHub Pages only if everything passes. Pull requests (Dependabot included) are
# tested without being published. Ubuntu is pinned (24.04): the Linux visual baselines depend on it.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the "Updated …" date is that of the last commit touching the content
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check (Astro, TypeScript)
        run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: "Lighthouse — thresholds: 100 for accessibility, best practices and SEO, 90 for performance"
        run: npx lhci autorun
      - name: Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            lighthouse-report/
          retention-days: 14

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the "Updated …" date is that of the last commit touching the content
      - name: Build and prepare the deployment
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
